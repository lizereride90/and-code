# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
# 8 GB: the baked desktop rootfs is a ~700 MB single asset and the asset-compression task needs
# headroom well beyond the default 4 GB to stage it without falling over into "Java heap space".
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# CI spends almost all of its time recompiling from scratch. The build cache lets a run reuse
# task outputs produced by an earlier run (persisted from main by gradle/actions/setup-gradle),
# which is what makes the second and later builds of the same commit range cheap.
org.gradle.caching=true
org.gradle.parallel=true
