# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# CI spends almost all of its time recompiling from scratch. The build cache lets a run reuse
# task outputs produced by an earlier run (persisted from main by gradle/actions/setup-gradle),
# which is what makes the second and later builds of the same commit range cheap.
org.gradle.caching=true
org.gradle.parallel=true

# GitHub OAuth app used for GitHub sign-in (device flow). The client ID is public by design and is
# baked into BuildConfig.GITHUB_CLIENT_ID - this is what makes every build's GitHub sign-in work.
# Override with the GITHUB_CLIENT_ID env var or -PGITHUB_CLIENT_ID=... when building for a
# different OAuth app. Never add a client secret here or anywhere in the repo: it would be
# extractable from the APK and GitHub would force a rotation.
andcode.githubClientId=Ov23li2hbjBXqTQgUwxe
