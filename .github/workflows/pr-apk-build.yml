name: PR APK Build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DESKTOP_ROOTFS_BASE: runtime-image/out
  DESKTOP_ROOTFS_ASSET_NAME: andcode-desktop-arm64-v8a.tar.gz

jobs:
  # Builds the fully-provisioned Debian desktop rootfs (packages + XFCE + TigerVNC + gh baked in)
  # on a native arm64 runner and passes it to the APK job, which embeds it as an app asset. The
  # rootfs is cached keyed on runtime-image/VERSION, so CI stays fast after the first run; bump
  # VERSION whenever the Dockerfile recipe changes.
  build-desktop-rootfs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-apk' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-desktop-rootfs
        with:
          path: ${{ env.DESKTOP_ROOTFS_BASE }}/${{ env.DESKTOP_ROOTFS_ASSET_NAME }}
          key: andcode-desktop-arm64-v8a-${{ hashFiles('runtime-image/VERSION') }}
      - name: Build baked desktop rootfs
        if: steps.cache-desktop-rootfs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$DESKTOP_ROOTFS_BASE"
          docker build \
            --platform linux/arm64 \
            -t andcode-debian-desktop:local \
            -f runtime-image/debian-desktop/Dockerfile \
            runtime-image/debian-desktop
          container="$(docker create andcode-debian-desktop:local)"
          docker export "$container" | gzip -1 > "$DESKTOP_ROOTFS_BASE/$DESKTOP_ROOTFS_ASSET_NAME"
          docker rm "$container" >/dev/null
          ls -lh "$DESKTOP_ROOTFS_BASE/$DESKTOP_ROOTFS_ASSET_NAME"
          sha256sum "$DESKTOP_ROOTFS_BASE/$DESKTOP_ROOTFS_ASSET_NAME"
      - name: Embed desktop rootfs into app assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/local-runtime
          cp "$DESKTOP_ROOTFS_BASE/$DESKTOP_ROOTFS_ASSET_NAME" app/src/main/assets/local-runtime/
          ls -lh app/src/main/assets/local-runtime/

  build:
    needs: build-desktop-rootfs
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-desktop-rootfs
        with:
          path: ${{ env.DESKTOP_ROOTFS_BASE }}/${{ env.DESKTOP_ROOTFS_ASSET_NAME }}
          key: andcode-desktop-arm64-v8a-${{ hashFiles('runtime-image/VERSION') }}
      - name: Embed desktop rootfs into app assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/local-runtime
          cp "$DESKTOP_ROOTFS_BASE/$DESKTOP_ROOTFS_ASSET_NAME" app/src/main/assets/local-runtime/
          ls -lh app/src/main/assets/local-runtime/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      # See release.yml for why this is AND_CODE_-prefixed rather than GITHUB_CLIENT_ID directly.
      - run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
      - id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: and-code-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Comment or update APK link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = '${{ steps.upload-apk.outputs.artifact-url }}';
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'all', per_page: 1,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info('No associated pull request found; skipping comment.');
              return;
            }
            const marker = '<!-- and-code-debug-apk -->';
            const body = [
              marker,
              '**Debug APK built successfully**',
              '',
              `[Download APK artifact](${artifactUrl})`,
              `[View workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
              '',
              `Commit: \`${context.sha.slice(0, 12)}\` | Artifact expires in 14 days.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }