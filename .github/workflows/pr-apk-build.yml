name: PR APK Build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      # The ubuntu-latest runner image already ships the Android SDK (like android.yml), so no
      # separate SDK setup step is needed - android-actions/setup-android@v3 fails because the
      # legacy `tools` sdkmanager package it installs no longer exists.
      # See release.yml for why this is AND_CODE_-prefixed rather than GITHUB_CLIENT_ID directly.
      - run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleStandaloneDebug
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
      - id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: and-code-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 14
      - id: upload-standalone-apk
        uses: actions/upload-artifact@v4
        with:
          name: and-code-vnc-debug-apk
          path: app/build/outputs/apk/standalone/debug/app-standalone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Comment or update APK link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = '${{ steps.upload-apk.outputs.artifact-url }}';
            const standaloneArtifactUrl = '${{ steps.upload-standalone-apk.outputs.artifact-url }}';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'all', per_page: 1,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info('No associated pull request found; skipping comment.');
              return;
            }
            const marker = '<!-- and-code-debug-apk -->';
            const body = [
              marker,
              '**Debug APKs built successfully**',
              '',
              `[AndCode APK](${artifactUrl}) — replaces the installed AndCode app`,
              `[AndCode VNC (standalone) APK](${standaloneArtifactUrl}) — installs side-by-side, own package name \`com.yugahashimoto.andcode.vnc\``,
              `[View workflow run](${runUrl})`,
              '',
              `Commit: \`${context.sha.slice(0, 12)}\` | Artifacts expire in 14 days.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
